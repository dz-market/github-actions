name: Docker Publish

on:
    workflow_call:
        inputs:
            file:
                description: Path to Dockerfile
                type: string
                default: Dockerfile

            target:
                description: Dockerfile stage to build
                type: string
                required: true

            image:
                description: Full image name override
                type: string
                default: ""

            suffix:
                description: Suffix appended to the image name
                type: string
                default: ""

            platforms:
                type: string
                default: linux/amd64

permissions:
    contents: read
    packages: write

jobs:
    publish:
        name: Publish ${{ inputs.target }}
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            -   uses: actions/checkout@v7

            -   id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ${{ inputs.image || format('ghcr.io/{0}{1}', github.repository, inputs.suffix) }}
                    tags: type=semver,pattern={{version}}

            -   uses: docker/setup-buildx-action@v4

            -   uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   id: build
                uses: docker/build-push-action@v7
                with:
                    context: .
                    file: ${{ inputs.file }}
                    target: ${{ inputs.target }}
                    platforms: ${{ inputs.platforms }}
                    push: true
                    tags: ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha,scope=${{ inputs.target }}
                    cache-to: type=gha,scope=${{ inputs.target }},mode=max