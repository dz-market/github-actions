name: Go CI

on:
    workflow_call:
        inputs:
            modules:
                description: Go module directories
                type: string
                default: "."

            golangci-lint-version:
                description: Version of golangci-lint
                type: string
                default: v2.14

            coverage-upload:
                description: Upload coverage to Codecov
                type: boolean
                default: true

permissions:
    contents: read
    id-token: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-go@v7
                with:
                    go-version: stable
                    cache-dependency-path: "**/go.sum"

            -   uses: golangci/golangci-lint-action@v9
                with:
                    version: ${{ inputs.golangci-lint-version }}
                    install-only: true

            -   name: Lint modules
                uses: dz-market/github-actions/actions/run-modules@v1
                with:
                    modules: ${{ inputs.modules }}
                    command: golangci-lint run --path-mode=abs

    test:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-go@v7
                with:
                    go-version: stable
                    cache-dependency-path: "**/go.sum"

            -   name: Check go.mod tidiness
                uses: dz-market/github-actions/actions/run-modules@v1
                with:
                    modules: ${{ inputs.modules }}
                    command: go mod tidy -diff

            -   name: Build
                uses: dz-market/github-actions/actions/run-modules@v1
                with:
                    modules: ${{ inputs.modules }}
                    command: go build ./...

            -   name: Run tests with coverage
                uses: dz-market/github-actions/actions/run-modules@v1
                with:
                    modules: ${{ inputs.modules }}
                    command: go test -race -count=1 -coverprofile=coverage.out ./...

            -   name: Upload coverage
                if: ${{ inputs.coverage-upload }}
                uses: codecov/codecov-action@v7
                with:
                    use_oidc: true

    vulncheck:
        name: Vulncheck
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v7

            -   uses: actions/setup-go@v7
                with:
                    go-version: stable
                    cache-dependency-path: "**/go.sum"

            -   name: Install govulncheck
                run: go install golang.org/x/vuln/cmd/govulncheck@latest

            -   name: Check modules for vulnerabilities
                uses: dz-market/github-actions/actions/run-modules@v1
                with:
                    modules: ${{ inputs.modules }}
                    command: govulncheck ./...