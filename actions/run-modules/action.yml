name: Run modules
description: Run a command in each Go module directory

inputs:
    modules:
        description: Newline-separated Go module directories, or auto to discover modules
        required: false
        default: "."

    command:
        description: Shell command to run in each module
        required: true

runs:
    using: composite
    steps:
        -   name: Run command across modules
            shell: bash
            env:
                MODULES: ${{ inputs.modules }}
                COMMAND: ${{ inputs.command }}
            run: bash "${{ github.action_path }}/run.sh"